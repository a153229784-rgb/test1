<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="a153229784-rgb 的个人主页">
  <title>我的个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --blue-900: #123b68;
      --blue-700: #1f5f9f;
      --blue-500: #3a86d1;
      --blue-100: #dceeff;
      --blue-050: #f2f8ff;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--blue-900);
      background:
        radial-gradient(circle at 15% 20%, rgba(58, 134, 209, 0.16), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(31, 95, 159, 0.12), transparent 32%),
        linear-gradient(145deg, var(--white), var(--blue-050));
    }

    .page {
      width: min(88vw, 760px);
      padding: clamp(2.5rem, 7vw, 5.5rem);
      position: relative;
      text-align: center;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(58, 134, 209, 0.2);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(18, 59, 104, 0.12);
      backdrop-filter: blur(12px);
    }

    .page::before {
      content: "";
      width: 64px;
      height: 5px;
      position: absolute;
      top: 0;
      left: 50%;
      border-radius: 0 0 999px 999px;
      background: var(--blue-500);
      transform: translateX(-50%);
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      color: var(--blue-700);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5rem);
      line-height: 1.06;
      letter-spacing: -0.05em;
    }

    .name {
      display: inline-block;
      margin-top: 1rem;
      color: var(--blue-500);
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .intro {
      max-width: 32rem;
      margin: 1.6rem auto 0;
      color: #486783;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.85;
    }

    .dot {
      width: 10px;
      height: 10px;
      margin: 2rem auto 0;
      border-radius: 50%;
      background: var(--blue-500);
      box-shadow: 18px 0 0 var(--blue-100), -18px 0 0 var(--blue-100);
    }

    @media (prefers-reduced-motion: no-preference) {
      .page {
        animation: arrive 700ms ease-out both;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Personal Homepage</p>
    <h1>你好，欢迎来到我的主页</h1>
    <div class="name">a153229784-rgb</div>
    <p class="intro">我正在学习用代码记录灵感，也期待把每一次尝试都变成更好的作品。</p>
    <div class="dot" aria-hidden="true"></div>
  </main>
</body>
</html>
